<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Consulte sua Máquina | Emanuel Soluções</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f8f9ff">
<meta name="description" content="Consulte o status do reparo da sua máquina - Emanuel Soluções">

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#004394",
            background: "#f8f9ff",
            "surface-container-low": "#eff4ff",
            "surface-container": "#e5eeff",
            "on-background": "#0b1c30",
            "on-surface-variant": "#424753",
            "outline-variant": "#c2c6d5"
          },
          fontFamily: { sans: ["Geist"] }
        }
      }
    }
</script>

<style>
    body { font-family: 'Geist', sans-serif; background-color: #f8f9ff; -webkit-tap-highlight-color: transparent; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .card { background-color: #ffffff; border-radius: 1rem; box-shadow: 0px 4px 20px rgba(0,0,0,0.06); }
    .input-field { width: 100%; background-color: #eff4ff; border: 1px solid #c2c6d5; color: #0b1c30; border-radius: 0.9rem; padding: 1rem 1.1rem; font-size: 16px; transition: all .2s; }
    .input-field:focus { outline: none; border-color: #004394; box-shadow: 0 0 0 3px rgba(0,67,148,0.12); }
    .input-field::placeholder { color: #727784; text-transform: none; }
    .btn-primary { background-color: #004394; color: #ffffff; font-weight: 600; border-radius: 0.9rem; padding: 1rem 1.5rem; transition: all .2s; text-transform: uppercase; letter-spacing: 0.02em; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: .6; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #c2c6d5; border-radius: 10px; }

    /* Barra de progresso das 3 etapas */
    .etapa { display:flex; flex-direction:column; align-items:center; flex:1; position:relative; }
    .etapa-linha { position:absolute; top:14px; left:-50%; width:100%; height:3px; background:#c2c6d5; z-index:0; }
    .etapa:first-child .etapa-linha { display:none; }
    .etapa-bola { width:30px; height:30px; border-radius:9999px; display:flex; align-items:center; justify-content:center; font-size:15px; background:#c2c6d5; color:#fff; z-index:1; transition: all .3s; }
    .etapa-label { font-size:10px; font-weight:700; text-transform:uppercase; margin-top:6px; color:#727784; text-align:center; letter-spacing:.02em; }
    .etapa.ativo .etapa-bola, .etapa.feito .etapa-bola { background:#004394; }
    .etapa.feito .etapa-linha { background:#004394; }
    .etapa.ativo .etapa-label, .etapa.feito .etapa-label { color:#004394; }
</style>
</head>
<body class="text-on-background min-h-screen flex flex-col items-center">

    <!-- Topo -->
    <header class="w-full bg-white shadow-sm py-5 px-6 flex items-center justify-center gap-2 mb-6">
        <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">precision_manufacturing</span>
        <h1 class="font-semibold text-primary tracking-tight text-lg">Emanuel Soluções</h1>
    </header>

    <main class="w-full max-w-md px-4 pb-16 flex-1">

        <div class="text-center mb-6">
            <h2 class="text-xl font-bold text-on-background">Consulte sua Máquina</h2>
            <p class="text-sm text-on-surface-variant mt-1">Digite o código que está no recibo de entrada ou na etiqueta colada na tampa da máquina para ver o andamento do seu reparo.</p>
        </div>

        <!-- Busca -->
        <div class="card p-4 flex gap-2 mb-6">
            <input id="inputCodigo" class="input-field uppercase font-semibold text-center tracking-widest" placeholder="EX: ABC123" maxlength="10" type="text" autocomplete="off"/>
            <button id="btnBuscar" onclick="consultar()" class="btn-primary px-5 flex items-center justify-center shrink-0">
                <span class="material-symbols-outlined">search</span>
            </button>
        </div>

        <div id="resultado" class="space-y-4"></div>

        <p class="text-center text-[11px] text-on-surface-variant mt-10">Dúvidas? Fale diretamente com a Emanuel Soluções.</p>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB9_vQUtyjCx8KQw3k5fPlutOD-ekCaHw8",
            authDomain: "projeto-app-entregadores.firebaseapp.com",
            projectId: "projeto-app-entregadores",
            storageBucket: "projeto-app-entregadores.firebasestorage.app",
            messagingSenderId: "857050021216",
            appId: "1:857050021216:web:a16943cd5a272b0c4d3205"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function formatarDataBR(dataStr) {
            if (!dataStr) return "---";
            if (dataStr.includes("-")) {
                const partes = dataStr.split(" ")[0].split("-");
                if (partes.length === 3 && partes[0].length === 4) {
                    return `${partes[2]}/${partes[1]}/${partes[0]}`;
                }
            }
            return dataStr;
        }

        // Calcula garantia de N dias (padrão 90) a partir da data de pagamento/retirada (formato dd/mm/aaaa)
        function calcularGarantia(dataPagamentoStr, diasGarantia = 90) {
            if (!dataPagamentoStr || typeof dataPagamentoStr !== 'string' || !dataPagamentoStr.includes('/')) return null;
            const partes = dataPagamentoStr.split('/');
            if (partes.length !== 3) return null;
            const dia = parseInt(partes[0], 10), mes = parseInt(partes[1], 10) - 1, ano = parseInt(partes[2], 10);
            const dataInicio = new Date(ano, mes, dia);
            if (isNaN(dataInicio.getTime())) return null;

            const dataFim = new Date(dataInicio);
            dataFim.setDate(dataFim.getDate() + diasGarantia);

            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);
            dataFim.setHours(0, 0, 0, 0);

            const diasRestantes = Math.ceil((dataFim - hoje) / (1000 * 60 * 60 * 24));
            const dataFimBR = `${String(dataFim.getDate()).padStart(2, '0')}/${String(dataFim.getMonth() + 1).padStart(2, '0')}/${dataFim.getFullYear()}`;

            return { ativa: diasRestantes > 0, diasRestantes, dataFim: dataFimBR };
        }

        // Mapeia o status interno da oficina para uma linguagem simples pro cliente
        function infoEtapa(status) {
            const s = (status || "").toUpperCase().trim();
            if (s === "PAGO") return { passo: 3, titulo: "Concluído", desc: "Serviço finalizado e pago. Máquina liberada para retirada.", cor: "text-emerald-600", bg: "bg-emerald-100 text-emerald-800" };
            if (s === "AGUARDANDO PAGAMENTO") return { passo: 2, titulo: "Pronto - Aguardando Pagamento", desc: "O reparo foi concluído. Falta apenas o pagamento para retirar.", cor: "text-blue-600", bg: "bg-blue-100 text-blue-800" };
            return { passo: 1, titulo: "Em Análise", desc: "Sua máquina está na bancada em diagnóstico/reparo.", cor: "text-amber-600", bg: "bg-amber-100 text-amber-800" };
        }

        function renderBarraEtapas(passoAtual) {
            const etapas = [
                { n: 1, label: "Recebido" },
                { n: 2, label: "Pronto" },
                { n: 3, label: "Concluído" }
            ];
            return `
                <div class="flex items-start w-full px-2">
                    ${etapas.map(e => `
                        <div class="etapa ${passoAtual > e.n ? 'feito' : (passoAtual === e.n ? 'ativo' : '')}">
                            <div class="etapa-linha"></div>
                            <div class="etapa-bola">
                                <span class="material-symbols-outlined text-[16px]">${passoAtual > e.n ? 'check' : (e.n === 1 ? 'inventory_2' : (e.n === 2 ? 'payments' : 'task_alt'))}</span>
                            </div>
                            <div class="etapa-label">${e.label}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        window.consultar = async () => {
            const cod = document.getElementById('inputCodigo').value.toUpperCase().trim();
            const resultado = document.getElementById('resultado');
            const btn = document.getElementById('btnBuscar');

            if (cod.length < 3) return alert("Digite o código completo informado no recibo.");

            btn.disabled = true;
            resultado.innerHTML = "<p class='p-8 text-center animate-pulse text-xs text-primary/70 font-semibold'>Consultando...</p>";

            try {
                const q = query(collection(db, "ordens"), where("codigo_maquina", "==", cod));
                const snap = await getDocs(q);

                if (snap.empty) {
                    resultado.innerHTML = `
                        <div class="card p-6 text-center">
                            <span class="material-symbols-outlined text-red-500 text-3xl mb-2">search_off</span>
                            <p class="text-red-500 font-bold text-sm uppercase">Código não encontrado</p>
                            <p class="text-on-surface-variant text-xs mt-1">Verifique se digitou corretamente o código do recibo.</p>
                        </div>
                    `;
                    return;
                }

                let itens = [];
                snap.forEach(d => itens.push(d.data()));
                itens.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                resultado.innerHTML = "";

                // Resumo geral do equipamento (aparece quando há mais de uma visita registrada)
                if (itens.length > 1) {
                    const totalVisitas = itens.length;
                    const totalInvestido = itens.filter(i => (i.status || '').toUpperCase() === 'PAGO').reduce((a, b) => a + parseFloat(b.valor_servico || 0), 0);
                    resultado.innerHTML += `
                        <div class="card p-4 bg-primary/5 border border-primary/10 flex items-center justify-between">
                            <div>
                                <p class="text-[10px] font-bold uppercase text-primary/70">Total de Visitas</p>
                                <p class="text-lg font-bold text-primary">${totalVisitas}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] font-bold uppercase text-primary/70">Total Investido</p>
                                <p class="text-lg font-bold text-primary">R$ ${totalInvestido.toFixed(2)}</p>
                            </div>
                        </div>
                    `;
                }

                itens.forEach(d => {
                    const status = (d.status || '').toUpperCase().trim();
                    const info = infoEtapa(status);
                    const total = parseFloat(d.valor_servico || 0);
                    const itensExecutados = d.servico_principal ? d.servico_principal.split('+').map(s => s.trim()).filter(Boolean) : [];
                    const garantia = status === 'PAGO' ? calcularGarantia(d.data_pagamento) : null;

                    resultado.innerHTML += `
                        <div class="card p-5">
                            <div class="flex justify-between items-center mb-4">
                                <span class="text-[10px] font-bold uppercase bg-surface-container-low px-2 py-0.5 rounded-md text-on-surface-variant">OS #${d.id}</span>
                                <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full ${info.bg}">${info.titulo}</span>
                            </div>

                            ${renderBarraEtapas(info.passo)}

                            <div class="mt-5 pt-4 border-t border-outline-variant/40 space-y-2">
                                <p class="text-sm text-on-surface-variant">${info.desc}</p>
                                <div class="text-[12px] bg-surface-container-low p-3 rounded-xl space-y-1 font-medium text-on-surface-variant mt-2">
                                    <p><span class="text-on-background font-bold">EQUIPAMENTO:</span> ${d.equipamento || '---'}</p>
                                    <p><span class="text-on-background font-bold">ENTRADA:</span> ${formatarDataBR(d.data_entrada)}</p>
                                    ${status === 'PAGO' ? `<p><span class="text-on-background font-bold">RETIRADA/PAGAMENTO:</span> ${formatarDataBR(d.data_pagamento)}</p>` : ''}
                                </div>

                                ${itensExecutados.length ? `
                                    <div class="mt-3">
                                        <p class="text-[11px] font-bold uppercase text-on-surface-variant mb-1.5">Peças e Serviços Realizados</p>
                                        <div class="space-y-1.5">
                                            ${itensExecutados.map(item => `
                                                <div class="flex items-center gap-2 bg-surface-container-low border border-outline-variant/30 rounded-lg px-3 py-2">
                                                    <span class="material-symbols-outlined text-primary text-[16px]">build_circle</span>
                                                    <span class="text-[12px] font-semibold text-on-background uppercase flex-1">${item}</span>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}

                                ${garantia ? `
                                    <div class="mt-3 rounded-xl p-3 border ${garantia.ativa ? 'bg-emerald-50 border-emerald-200' : 'bg-surface-container-low border-outline-variant/40'}">
                                        <div class="flex items-center gap-2">
                                            <span class="material-symbols-outlined text-[18px] ${garantia.ativa ? 'text-emerald-600' : 'text-on-surface-variant'}">verified_user</span>
                                            <span class="text-[11px] font-bold uppercase ${garantia.ativa ? 'text-emerald-700' : 'text-on-surface-variant'}">
                                                ${garantia.ativa ? `Na garantia até ${garantia.dataFim} (faltam ${garantia.diasRestantes} dia${garantia.diasRestantes === 1 ? '' : 's'})` : `Garantia expirada em ${garantia.dataFim}`}
                                            </span>
                                        </div>
                                        <p class="text-[10px] text-on-surface-variant mt-1 pl-6">Garantia de 90 dias sobre as peças e serviços listados acima, contados a partir da data de retirada.</p>
                                    </div>
                                ` : ''}

                                ${(status === 'AGUARDANDO PAGAMENTO' || status === 'PAGO') ? `
                                    <div class="flex items-center justify-between pt-2">
                                        <span class="text-xs font-bold text-on-surface-variant uppercase">Valor</span>
                                        <span class="text-xl font-bold ${info.cor}">R$ ${total.toFixed(2)}</span>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                resultado.innerHTML = `<div class="card p-6 text-center text-red-500 text-xs font-semibold">Erro ao consultar: ${e.message}</div>`;
            } finally {
                btn.disabled = false;
            }
        };

        document.getElementById('inputCodigo').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') window.consultar();
        });
    </script>
</body>
</html>
